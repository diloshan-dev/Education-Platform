<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — A/L Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-brand">
    <div class="mark">A/L</div>
    <div>A/L Platform<span class="tag">Advanced Level · Sri Lanka</span></div>
  </a>
  <ul class="nav-links">
    <li><a href="index.html" data-page="index.html">Home</a></li>
    <li><a href="index.html#about" data-page="about">About</a></li>
    <li><a href="papers.html" data-page="papers.html">Buy papers</a></li>
  </ul>
  <div class="nav-right" id="nav-auth-slot"></div>
  <button class="theme-toggle" title="Toggle theme"><div class="knob"></div></button>
  <button class="nav-burger"><span></span></button>
</nav>

<section class="auth-screen">
  <div class="auth-card">
    <div class="auth-card-inner">
      <div class="auth-head">
        <div class="mark">A/L</div>
        <h1>Create your account</h1>
        <p>Free to join — buy only the papers you need</p>
      </div>

      <form id="signupForm" novalidate>
        <div class="field">
          <label for="signupName">Full name</label>
          <input type="text" id="signupName" placeholder="Kavindu Perera" required>
        </div>
        <div class="field">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="signupPass">Password</label>
          <input type="password" id="signupPass" placeholder="At least 4 characters" required>
        </div>
        <div style="height:6px"></div>
        <button type="submit" class="auth-submit">Sign up</button>
        <div class="form-msg" id="signupMsg"></div>
      </form>

      <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</section>

<script src="main.js"></script>
<script src="auth.js"></script>
</body>
</html>
